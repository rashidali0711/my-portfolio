<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f17" />
      <stop offset="100%" stop-color="#16192b" />
    </linearGradient>

    <!-- Glowing Tech Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Monogram Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge Base -->
  <rect 
    x="8" 
    y="8" 
    width="112" 
    height="112" 
    rx="32" 
    ry="32" 
    fill="url(#bgGrad)" 
    stroke="url(#borderGrad)" 
    stroke-width="5" 
  />

  <!-- Inner subtle ambient glow -->
  <circle cx="64" cy="64" r="42" fill="#6366f1" opacity="0.12" />

  <!-- Bold RS Monogram Typography -->
  <text 
    x="60" 
    y="79" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="52" 
    font-weight="900" 
    letter-spacing="0.5" 
    fill="url(#textGrad)" 
    text-anchor="middle"
  >RS</text>

  <!-- Cyber Cyan Accent Dot (Signature Period) -->
  <circle cx="98" cy="76" r="5.5" fill="#06b6d4" filter="url(#cyanGlow)" />
</svg>
